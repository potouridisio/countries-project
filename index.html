<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countries project</title>
  </head>
  <body class="flex h-dvh items-center justify-center bg-gray-50">
    <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-lg">
      <form>
        <div class="mb-4">
          <label
            for="search"
            class="mb-1 block text-sm font-medium text-gray-700"
            >Search for a country</label
          >
          <div class="relative">
            <input
              id="search"
              name="search"
              placeholder="e.g. Greece, Japan..."
              class="w-full rounded-lg border border-gray-300 px-4 py-2 pr-10 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
            />
            <!-- TODO: fix caret down icon -->
            <!-- TODO: display a spinner while searching (request is pending) -->
            <!-- TODO: type g and go figure a fix -->
            <svg
              id="searchIcon"
              class="absolute top-1/2 right-3 h-4 w-4 -translate-y-1/2 text-gray-400"
              xmlns="http://www.w3.org/2000/svg"
              x="0px"
              y="0px"
              width="100"
              height="100"
              viewBox="0 0 50 50"
            >
              <path
                d="M 21 3 C 11.621094 3 4 10.621094 4 20 C 4 29.378906 11.621094 37 21 37 C 24.710938 37 28.140625 35.804688 30.9375 33.78125 L 44.09375 46.90625 L 46.90625 44.09375 L 33.90625 31.0625 C 36.460938 28.085938 38 24.222656 38 20 C 38 10.621094 30.378906 3 21 3 Z M 21 5 C 29.296875 5 36 11.703125 36 20 C 36 28.296875 29.296875 35 21 35 C 12.703125 35 6 28.296875 6 20 C 6 11.703125 12.703125 5 21 5 Z"
              ></path>
            </svg>
            <div id="spinner"></div>
          </div>
        </div>
      </form>
      <!-- Results list -->
      <ul id="results" class="divide-y divide-gray-100"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
